# The workshop guide: README.md and each steps/*/README.md as web pages, at
# http://guide.localhost:18180 (components/guide).
#
# It runs beside the demo websites, on the demo-sites host group, so it stays up
# whichever step's manifest is applied. The ingress sends guide.localhost to
# that host group, and the host sends the request on by its Host header.
#
# The component's pages were rendered from the READMEs when it was built. It
# imports no files, no sockets and no HTTP client, and this entry grants it
# nothing: no localResources, no other host interfaces.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: guide
  namespace: demo-sites
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: demo-sites
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: guide.localhost
      components:
        - name: guide
          image: workshop-toolbox-registry:5000/workshop/guide:0.4.0
