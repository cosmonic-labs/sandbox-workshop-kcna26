# Step 6's cluster side: a namespace with something to look at, and the
# identity the kube-api plugin uses to look.
#
# The plugin (k8s/values.yaml, default host group) holds the token of a
# read-only identity, the agent-reader service account, shared by any workload
# on this host group that declares the plugin. It adds that token to every
# request it forwards, whatever the method and path, so RBAC on agent-reader
# is the whole of what those workloads may do: read pods, their logs,
# Services, Deployments and WorkloadDeployments in the demo namespace. No
# Secrets, no ConfigMaps, no writes, no exec, nothing in any other namespace.
# Pod logs are allowed because step 6 reads one; logs can carry sensitive data,
# so grant pods/log only where that is acceptable.
#
# scripts/up.sh applies this before the chart, because the host reads the
# token once, when it starts.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# The host groups' namespace; the chart installs into it.
apiVersion: v1
kind: Namespace
metadata:
  name: wasmcloud
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-reader
  namespace: wasmcloud
automountServiceAccountToken: false
---
# A long-lived token: the token controller fills in `token` (with `ca.crt` and
# `namespace`). It lasts until this Secret is deleted. The host reads it at
# startup, so rotating it means restarting the host pods:
#   kubectl -n wasmcloud rollout restart deploy/hostgroup-default
apiVersion: v1
kind: Secret
metadata:
  name: kube-api-token
  namespace: wasmcloud
  annotations:
    kubernetes.io/service-account.name: agent-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-only
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-reader-read-only
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: agent-reader
    namespace: wasmcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-only
---
# Something to find.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: hello}
  template:
    metadata:
      labels: {app: hello}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hello
          # scripts/up.sh loads this tag into the node from a pull by digest
          # (NODE_IMAGES in scripts/env.sh), so IfNotPresent never pulls it.
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo hello from $(hostname); sleep 100000"]
---
# And something agent-reader must not read.
apiVersion: v1
kind: Secret
metadata:
  name: db-password
  namespace: demo
stringData:
  password: not-for-agents
