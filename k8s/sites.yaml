# The mock sites' namespace and the names agents call them by.
#
# The mock-sites host group (k8s/values.yaml) runs its host pods in this
# namespace, and the mock-sites workload runs on it. Each Service below is an
# ordinary ClusterIP Service on port 80 that selects those host pods, so
# http://api.mock-sites.svc reaches the mock-sites host over the cluster
# network like any other Service. The host sends the request to the workload
# that serves its Host header (mock-sites/workloaddeployment.yaml).
#
# Created before the chart, which expects a host group's namespace to exist.
apiVersion: v1
kind: Namespace
metadata:
  name: mock-sites
---
# A stand-in for an attacker's server: on the network, never granted.
apiVersion: v1
kind: Service
metadata:
  name: attacker
  namespace: mock-sites
spec:
  selector:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: mock-sites
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
# The ordinary API the agent is meant to call, and the one host the curl tool
# is granted in the steps.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mock-sites
spec:
  selector:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: mock-sites
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
# The talks service: an ordinary REST API over the conference talks, standing
# in for a service a team already runs (mock-sites/talks-api.yaml). Only the
# talks MCP server is granted it.
apiVersion: v1
kind: Service
metadata:
  name: talks
  namespace: mock-sites
spec:
  selector:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: mock-sites
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
# The talks MCP server (mock-sites/talks-mcp.yaml), the one host step 3's mcp
# tool is granted.
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: mock-sites
spec:
  selector:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: mock-sites
  ports:
    - { name: http, port: 80, targetPort: 80 }
