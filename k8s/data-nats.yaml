# The workshop's data service: a plain NATS server with JetStream, in its own
# namespace. The platform declares it as the backend for the keyvalue plugin
# (k8s/values.yaml, `plugins:`); workloads only ask for "keyvalue" and never
# see this address. It is separate from the wasmCloud control plane's NATS,
# which requires mutual TLS.
apiVersion: v1
kind: Namespace
metadata:
  name: workshop-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-nats
  namespace: workshop-data
spec:
  replicas: 1
  selector:
    matchLabels: { app: data-nats }
  template:
    metadata:
      labels: { app: data-nats }
    spec:
      containers:
        - name: nats
          image: docker.io/nats:2.12.8-alpine
          args: ["-js", "-sd", "/data"]
          ports:
            - { containerPort: 4222, name: client }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: data-nats
  namespace: workshop-data
spec:
  # NodePort so the platform side (scripts/up.sh, make prove) can create and
  # reset stores from the laptop: kind maps 30422 to 127.0.0.1:14322.
  type: NodePort
  selector: { app: data-nats }
  ports:
    - { port: 4222, targetPort: client, name: client, nodePort: 30422 }
