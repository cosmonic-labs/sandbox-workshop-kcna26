# Helm values for charts/runtime-operator v2.12.0 on kind: two host groups,
# one host pod each.
#
#   default     the agent (namespace wasmcloud)
#   demo-sites  the demo websites and the guide (namespace demo-sites, k8s/sites.yaml)
#
# Local routing (localBypassRouting) is off on both. With it on, any workload
# on a host may claim any hostname with localRoute and receive a share of the
# other workloads' requests to it. So the agent reaches the demo websites the
# ordinary way: cluster DNS and a Kubernetes Service.
gateway:
  # Deprecated upstream; HTTP reaches the host pods through k8s/ingress.yaml.
  enabled: false
# The chart's baseline NetworkPolicies (ingress only) are on by default (since
# v2.11.0). On kind v0.33.0, kindnet's policy enforcement then drops the DNS
# replies to the operator and host pods, which crash-loop with "failed to
# lookup address information" (seen 2026-10-27; not yet reported). Off for the
# workshop cluster only; keep them on in a real cluster.
networkPolicy:
  enabled: false
runtime:
  # The all-features host image is wash built with the host-component-plugins
  # feature, which step 4's github-api plugin needs. The default release image
  # (2.12.0) exits at startup when given a plugin image ("require a wash build
  # with the `host-component-plugins` feature"). Pinned by digest: the
  # multi-platform index of ghcr.io/wasmcloud/wash:2.12.0-all-features.
  image:
    tag: 2.12.0-all-features@sha256:b899dfa82e191ac31521d1985e6af25f200932025ab2760c9910a39c70dfdd4a
  # The workshop registry is plain HTTP on the kind network. The chart's
  # ociCaPaths is the safer choice for a real registry: this flag turns off
  # TLS for every registry the host pulls from.
  extraArgs:
    - --allow-insecure-registries
  hostGroups:
    - name: default
      replicas: 1
      http:
        enabled: true
        port: 80
        localBypassRouting: false
      # A ClusterIP Service, hostgroup-default, for the ingress to send to.
      service:
        type: ClusterIP
      # A hostPath volume must lie inside an allowed directory (since v2.11.0);
      # the default list is empty. The two folders the tools use: the
      # databases (sqlite, read only) and a writable folder for curl's -o.
      hostPaths:
        allowed:
          - /workshop/sqlite-data
          - /workshop/curl-data
      # Node paths (kind extraMounts, see scripts/up.sh) mounted into the host
      # container, so a Workload hostPath volume of these paths resolves.
      volumes:
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
            type: Directory
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
            type: Directory
        # Step 3: a database on the host pod's own filesystem that no workload
        # is granted. It is not in hostPaths.allowed above, so no workload may
        # even ask to mount it; native sqlite3 on this pod would open it.
        - name: private-data
          hostPath:
            path: /workshop/private-data
            type: Directory
      volumeMounts:
        - name: sqlite-data
          mountPath: /workshop/sqlite-data
        - name: curl-data
          mountPath: /workshop/curl-data
        - name: private-data
          mountPath: /workshop/private-data
          readOnly: true
      # Step 4's github-api host component plugin: GitHub reads for the gh
      # tool (github-api) and GitHub sign-in for the agent harness
      # (github-auth). The platform installs it on the host group; a workload
      # uses it only by declaring both under hostInterfaces. It builds every
      # URL itself, sends only GET, only to api.github.com and only for the
      # read paths the gh tool needs, and refuses everything else. Sign-in has
      # no scopes and two flows, both run by the plugin from start to finish:
      # the browser flow (GitHub's OAuth web application flow with PKCE), and
      # the code flow (GitHub's device flow) for Codespaces and terminals. The
      # token stays in the plugin's memory, keyed by the calling workload's id
      # (the host's wasmcloud:host/identity), and is gone when the host
      # restarts.
      #
      # client-id and client-secret name the GitHub OAuth app sign-in uses.
      # Its callback URL must be exactly
      # http://agent.localhost:18180/github/callback, and Enable Device Flow
      # must be ticked for the code flow. Until both are set, sign-in reports
      # that it isn't set up and everything else works signed out. Change
      # them, then `make up` (or helm upgrade) to apply.
      #
      # The client secret is in the repo on purpose. GitHub's own CLI does the
      # same: cli/cli commits its OAuth app's secret in
      # internal/authflow/flow.go, with the comment "This value is safe to be
      # embedded in version control". An app that every participant runs on
      # their own laptop can't keep a secret anyway. What the secret does is
      # identify the app; on its own it gets no token. A token still needs a
      # person to approve on github.com, and the code GitHub sends back is
      # bound by PKCE to a verifier that never leaves the plugin. The app asks
      # for no scopes, so even an approved token reads only public data. The
      # secret will be rotated after the event.
      #
      # Pinned by digest: the host refuses a plugin whose image digest
      # differs. scripts/push.sh gives each prebuilt .wasm a reproducible
      # image digest and prints it; after rebuilding artifacts/github_api.wasm,
      # copy the new digest here.
      plugins:
        - id: github-api
          image: workshop-toolbox-registry:5000/workshop/github-api:0.4.0
          digest: sha256:862bbe462731b44ae23695ec7488b49c6bdd527f33a55998e6653b9edd67f3f0
          pullPolicy: ifNotPresent
          allowedHosts:
            - github.com
            - api.github.com
          config:
            client-id: Ov23liN4pgXbvHJYd83G
            client-secret: 9728ab4cc69121ce7e38da40d446e402e94d83ce
    # The demo websites (steps/00-demo-sites) get a host group of their own, in
    # their own namespace, so the Services in k8s/sites.yaml can select its
    # pods. Workloads land here only by asking: hostSelector hostgroup: demo-sites.
    - name: demo-sites
      namespace: demo-sites
      replicas: 1
      http:
        enabled: true
        port: 80
        localBypassRouting: false
      service:
        type: ClusterIP
