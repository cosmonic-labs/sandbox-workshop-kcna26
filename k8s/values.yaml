# Helm values for charts/runtime-operator v2.10.3 on kind, one host.
gateway:
  enabled: false
runtime:
  # The workshop registry is plain HTTP on the kind docker network.
  extraArgs:
    - --allow-insecure-registries
  hostGroups:
    - name: default
      replicas: 1
      http:
        enabled: true
        port: 80
        # Same-host local routing (planted.example, collector.example,
        # llm.example), the chart's spelling of --http-local-routing.
        localBypassRouting: true
      # The node path (kind extraMount) mounted into the host container, so
      # a Workload hostPath volume of /workshop/notes resolves.
      volumes:
        - name: notes
          hostPath:
            path: /workshop/notes
            type: Directory
      volumeMounts:
        - name: notes
          mountPath: /workshop/notes
