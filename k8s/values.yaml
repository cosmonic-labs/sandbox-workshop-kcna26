# Helm values for charts/runtime-operator v2.11.0 on kind: two host groups,
# one host pod each.
#
#   default   the teams' agents (namespace wasmcloud)
#   fixtures  the toy sites only (namespace workshop-sites, k8s/sites.yaml)
#
# Local routing (localBypassRouting) is off on both. With it on, any workload
# on a host may claim any hostname with localRoute and receive a share of the
# other workloads' requests to it (upstream's threat model: give mutually
# hostile tenants their own host group). So agents reach the toy sites the
# ordinary way: cluster DNS and a Kubernetes Service.
gateway:
  # Deprecated upstream; HTTP reaches the host pods through k8s/ingress.yaml.
  enabled: false
# The chart's baseline NetworkPolicies (ingress only) are on by default since
# v2.11.0. On kind v0.33.0, kindnet's policy enforcement then drops the DNS
# replies to the operator and host pods, which crash-loop with "failed to
# lookup address information" (seen 2026-10-27; not yet reported). Off for the
# workshop cluster only; keep them on in a real cluster.
networkPolicy:
  enabled: false
runtime:
  # The workshop registry is plain HTTP on the kind network. The chart's
  # ociCaPaths is the safer choice for a real registry: this flag turns off
  # TLS for every registry the host pulls from.
  extraArgs:
    - --allow-insecure-registries
  hostGroups:
    - name: default
      replicas: 1
      http:
        enabled: true
        port: 80
        localBypassRouting: false
      # A ClusterIP Service, hostgroup-default, for the ingress to send to.
      service:
        type: ClusterIP
      # The agents' tools reach no key value store, so the default host group
      # declares no keyvalue backend. The toy sites' collector keeps its count
      # in keyvalue, so that backend lives on the fixtures host group below.
      #
      # Since v2.11.0 a hostPath volume must lie inside an allowed directory;
      # the default list is empty. The three folders the tools read: the talks
      # database (sqlite, read only), the hostile repository (git, read only)
      # and a writable folder for curl's -o.
      hostPaths:
        allowed:
          - /workshop/sqlite-data
          - /workshop/repo
          - /workshop/curl-data
      # Node paths (kind extraMounts, see scripts/up.sh) mounted into the host
      # container, so a Workload hostPath volume of these paths resolves.
      volumes:
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
            type: Directory
        - name: repo
          hostPath:
            path: /workshop/repo
            type: Directory
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
            type: Directory
      volumeMounts:
        - name: sqlite-data
          mountPath: /workshop/sqlite-data
        - name: repo
          mountPath: /workshop/repo
        - name: curl-data
          mountPath: /workshop/curl-data
    # The toy sites (steps/00-fixtures) get a host group of their own, in
    # their own namespace, so the Services in k8s/sites.yaml can select its
    # pods. Workloads land here only by asking: hostSelector hostgroup: fixtures.
    - name: fixtures
      namespace: workshop-sites
      replicas: 1
      http:
        enabled: true
        port: 80
        localBypassRouting: false
      service:
        type: ClusterIP
      # The collector keeps its count in keyvalue too.
      plugins:
        - id: wasmcloud-keyvalue-multiplexed
          allowedHosts: [data-nats.workshop-data.svc:4222]
          allowedIpNameLookups: [data-nats.workshop-data.svc]
          config:
            backend: nats
            url: nats://data-nats.workshop-data.svc:4222
