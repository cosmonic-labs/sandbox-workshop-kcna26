# One way in: a NodePort Service in front of the host pods. kind maps the
# node port to 127.0.0.1:18180 on your laptop (scripts/up.sh), so the steps'
# curl commands reach the host pods with no port-forward to keep alive. The
# host routes each request to a workload by its Host header.
apiVersion: v1
kind: Service
metadata:
  name: workshop-ingress
  namespace: wasmcloud
spec:
  type: NodePort
  selector:
    wasmcloud.com/name: hostgroup
    wasmcloud.com/hostgroup: default
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30180
