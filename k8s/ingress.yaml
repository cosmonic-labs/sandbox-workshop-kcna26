# One way in from your laptop. kind maps node port 30180 to 127.0.0.1:18180
# (scripts/up.sh), so the steps' curl commands work with no port-forward to
# keep alive.
#
# It picks a Service by the request's Host header. Each agent has its own
# Service with no selector (in its step manifest); the runtime operator keeps
# its endpoints pointed at the host pods that run that agent, so a request
# never lands on a host pod without it (step 8 scales to two). sites.localhost
# goes to the fixtures host group; any other name falls back to the default
# host group's own Service. A real cluster does this with its ingress
# controller or Gateway API; here it is a plain nginx. The agents' Services
# appear only when their step is applied, so nginx looks names up per request
# (resolver plus a variable) instead of once at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-ingress
  namespace: wasmcloud
data:
  default.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 120s;
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    map $host $backend {
      default            hostgroup-default.wasmcloud.svc.cluster.local;
      agent.localhost    toolbox-agent.default.svc.cluster.local;
      a.agent.localhost  toolbox-agent.team-a.svc.cluster.local;
      b.agent.localhost  toolbox-agent.team-b.svc.cluster.local;
    }
    server {
      listen 80 default_server;
      location / { proxy_pass http://$backend; }
    }
    server {
      listen 80;
      server_name sites.localhost;
      location / { proxy_pass http://hostgroup-fixtures.workshop-sites.svc.cluster.local; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-ingress
  namespace: wasmcloud
spec:
  replicas: 1
  selector:
    matchLabels: { app: workshop-ingress }
  template:
    metadata:
      labels: { app: workshop-ingress }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 80, name: http }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: conf
          configMap:
            name: workshop-ingress
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-ingress
  namespace: wasmcloud
spec:
  type: NodePort
  selector: { app: workshop-ingress }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30180
