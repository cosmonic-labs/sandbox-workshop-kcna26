# One way in from your laptop. kind maps node port 30180 to 127.0.0.1:28180
# (scripts/up.sh), so the steps' curl commands work with no port-forward to
# keep alive.
#
# It picks a Service by the request's Host header. The agent's Service has no
# selector (k8s/agent-service.yaml); the runtime operator keeps its endpoints
# pointed at the host pods that run the agent, so a request never lands on a
# host pod without it. guide.localhost (the workshop guide) goes to the
# mock-sites host group; any other name falls back to the default host group's
# own Service. A real cluster does this with its ingress
# controller or Gateway API; here it is a plain nginx. The agent's endpoints
# appear only once a step is applied, so nginx looks names up per request
# (resolver plus a variable) instead of once at startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-ingress
  namespace: wasmcloud
data:
  # Read by the nginx image's entrypoint as a template: it fills in
  # ${NGINX_LOCAL_RESOLVERS} with the DNS server from the pod's own
  # /etc/resolv.conf (the cluster's kube-dns), and leaves nginx's own
  # $variables alone. Every upstream is a variable, so nginx looks names up
  # per request with that server and never at startup: it starts even before
  # cluster DNS answers, and a name that doesn't resolve is a 502 for that
  # request (with the reason in the log) instead of a crash loop. Its resolver
  # also takes names as written, without the pod's DNS search list, which
  # on WSL2 can carry a Windows domain that Alpine's resolver gives up on.
  default.conf.template: |
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 120s;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    map $host $backend {
      default            hostgroup-default.wasmcloud.svc.cluster.local;
      agent.localhost    toolbox-agent.default.svc.cluster.local;
      guide.localhost    hostgroup-mock-sites.mock-sites.svc.cluster.local;
    }
    server {
      listen 80 default_server;
      location / { proxy_pass http://$backend; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-ingress
  namespace: wasmcloud
spec:
  replicas: 1
  selector:
    matchLabels: { app: workshop-ingress }
  template:
    metadata:
      labels: { app: workshop-ingress }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          # scripts/up.sh loads this tag into the node from a pull by digest
          # (NODE_IMAGES in scripts/env.sh), so IfNotPresent never pulls it.
          image: docker.io/library/nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          env:
            # Fill ${NGINX_LOCAL_RESOLVERS} from /etc/resolv.conf.
            - { name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS, value: "1" }
          ports:
            - { containerPort: 80, name: http }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/templates }
      volumes:
        - name: conf
          configMap:
            name: workshop-ingress
---
apiVersion: v1
kind: Service
metadata:
  name: workshop-ingress
  namespace: wasmcloud
spec:
  type: NodePort
  selector: { app: workshop-ingress }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30180
