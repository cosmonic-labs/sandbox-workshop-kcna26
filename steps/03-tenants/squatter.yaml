# Step 3 negative check (make prove runs it): team-b tries to answer for the
# toy sites' names on the host pod it shares with team-a.
#
# Any HTTP component will do; this one is team-b's own agent harness. It
# claims planted.workshop-sites.svc and the other two names both ways a
# workload can: localRoute (answer co-located callers in memory) and
# host-aliases (answer requests that arrive with that Host header). Local
# routing is off on every host group (k8s/values.yaml), so team-a's request
# to planted.workshop-sites.svc still goes out over the cluster network to
# the Service, which reaches only the fixtures host group. The claim is
# accepted and catches nothing.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: squatter
  namespace: team-b
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: squatter.b.agent.localhost
            host-aliases: planted.workshop-sites.svc,collector.workshop-sites.svc,llm.workshop-sites.svc
            localRoute: planted.workshop-sites.svc,collector.workshop-sites.svc,llm.workshop-sites.svc
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        - name: memory
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        - name: notes
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        - name: web
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
