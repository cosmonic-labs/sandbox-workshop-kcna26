# Step 3: a read_notes tool over a read-only volume, on that tool alone.
#
# Planted attack 1: notes/todo.txt tells the agent to read ../../etc/passwd
# and /etc/passwd and to append to the note. The scripted model obeys. The
# read_notes code is naive on purpose (it joins any path onto /notes and
# tries writes); the boundary is the manifest: one host directory, preopened
# read only, for this one component.
#
# The agent imports a model and four labelled tool slots. Each label must be
# filled by a component of that name in this workload, so until a step
# installs a real tool, the slot is filled by tool-stub (the same image under
# four names). The agent and the model get nothing else: no allowedHosts, no
# volumes, no environment.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: agent.localhost
        - namespace: wasi
          package: keyvalue
          version: 0.2.0-draft
          interfaces: [store]
      components:
        - name: agent
          image: localhost:15051/workshop/agent:0.1.0
        - name: model
          image: localhost:15051/workshop/model-scripted:0.1.0
        # remember is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: remember
          image: localhost:15051/workshop/tool-remember:0.1.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: read-notes
          image: localhost:15051/workshop/tool-read-notes:0.1.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: save-report
          image: localhost:15051/workshop/tool-stub:0.1.0
        - name: fetch
          image: localhost:15051/workshop/tool-stub:0.1.0
      volumes:
        - name: notes
          hostPath:
            # Relative paths are a convenience of scripts/apply.py; on a
            # cluster this is an absolute path on the node.
            path: ./notes
