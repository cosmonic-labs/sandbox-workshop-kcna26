# Step 6: give the agent kubectl.
#
# The same agent as step 1, with the real kubectl tool in its fourth slot.
# kubectl gets no allowedHosts, no volumes and no token. Its only way to the
# cluster is the workshop:toolbox/kube-api interface, declared below under
# hostInterfaces and served by the kube-api plugin the platform installed on
# the default host group (k8s/values.yaml). The plugin holds the token of a
# read-only identity, agent-reader, shared by any workload on this host group
# that declares the plugin. It forwards any method and path; RBAC on
# agent-reader (k8s/kube.yaml) decides what kubectl may do.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the toy sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        # The Kubernetes API, as a capability: the host links it to the
        # kube-api plugin. kubectl imports it; nothing else here does.
        - namespace: workshop
          package: toolbox
          interfaces: [kube-api]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.workshop-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.workshop-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the talks database, mounted read only at /data.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # git reads the repository, mounted read only at /repo.
        - name: git
          image: workshop-toolbox-registry:5000/workshop/tool-git:0.4.0
          localResources:
            volumeMounts:
              - name: repo
                mountPath: /repo
                readOnly: true
        # kubectl: no grants of its own. It reaches the cluster only through
        # the kube-api capability above.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/tool-kubectl:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
        - name: repo
          hostPath:
            path: /workshop/repo
