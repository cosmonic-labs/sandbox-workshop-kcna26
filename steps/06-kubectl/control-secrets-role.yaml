# Control for step 6: the same Role as k8s/kube.yaml, widened to read Secrets
# in demo. Nothing about the agent, the tool or the plugin changes. Apply it,
# ask for the secrets again, and they come back: RBAC was the only thing
# refusing them.
#
#   kubectl apply -f steps/06-kubectl/control-secrets-role.yaml
#   revert: kubectl apply -f k8s/kube.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-only
  namespace: demo
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services]
    verbs: [get, list]
  - apiGroups: [""]          # control: widened to Secrets
    resources: [secrets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [runtime.wasmcloud.dev]
    resources: [workloaddeployments]
    verbs: [get, list]
