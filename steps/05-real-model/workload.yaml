# Step 5: swap the scripted model for a real one.
#
# Same `model` slot, a different component behind it: model-real speaks the
# OpenAI chat completions API. The agent is not rebuilt; only this manifest
# entry changes. model-real is the only component allowed to reach the model
# endpoint.
#
# Offline here: LLM_URL points at llm.example, a fake OpenAI-compatible
# endpoint served by ../00-fixtures/toy-sites.yaml over local routing. For a
# hosted model, set LLM_URL to e.g. https://api.openai.com/v1/chat/completions,
# put api.openai.com in allowedHosts, and pass LLM_API_KEY from a Secret
# (environment.secretFrom on a cluster).
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: agent.localhost
        - namespace: wasi
          package: keyvalue
          version: 0.2.0-draft
          interfaces: [store]
        - namespace: wasi
          package: blobstore
          version: 0.2.0-draft
          interfaces: [blobstore]
          config:
            # The NATS blobstore refuses ("unauthorized") any container not
            # listed here. The list is per workload, not per component.
            buckets: reports
      components:
        - name: agent
          image: localhost:15051/workshop/agent:0.1.0
        - name: model
          image: localhost:15051/workshop/model-real:0.1.0
          localResources:
            allowedHosts:
              - llm.example
            environment:
              config:
                LLM_URL: http://llm.example/v1/chat/completions
                LLM_MODEL: fake-model
        # remember is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: remember
          image: localhost:15051/workshop/tool-remember:0.1.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: read-notes
          image: localhost:15051/workshop/tool-read-notes:0.1.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: save-report
          image: localhost:15051/workshop/tool-save-report:0.1.0
          localResources:
            environment:
              config:
                REPORT_CONTAINER: reports
        - name: fetch
          image: localhost:15051/workshop/tool-stub:0.1.0
      volumes:
        - name: notes
          hostPath:
            # Relative paths are a convenience of scripts/apply.py; on a
            # cluster this is an absolute path on the node.
            path: ../03-read-notes/notes
