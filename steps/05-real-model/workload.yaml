# Step 5: swap the scripted model for a real one.
#
# Same `model` slot, a different component behind it: model-real speaks the
# OpenAI chat completions API. The agent is not rebuilt; only this manifest
# entry changes. model-real is the only component allowed to reach the model
# endpoint.
#
# Offline here: LLM_URL points at llm.example, a fake OpenAI-compatible
# endpoint served by ../00-fixtures/toy-sites.yaml over local routing. For a
# hosted model, set LLM_URL to e.g. https://api.openai.com/v1/chat/completions,
# put api.openai.com in allowedHosts, and pass LLM_API_KEY from a Secret
# (environment.secretFrom on a cluster).
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        - namespace: wasmcloud
          package: keyvalue
          version: 0.2.0
          interfaces: [store]
        - namespace: wasmcloud
          package: blobstore
          version: 0.1.0
          interfaces: [blobstore, container, types]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.2.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-real:0.2.0
          localResources:
            allowedHosts:
              - llm.example
            environment:
              config:
                LLM_URL: http://llm.example/v1/chat/completions
                LLM_MODEL: fake-model
        # memory is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: memory
          image: workshop-toolbox-registry:5000/workshop/tool-memory:0.2.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: notes
          image: workshop-toolbox-registry:5000/workshop/tool-notes:0.2.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: reports
          image: workshop-toolbox-registry:5000/workshop/tool-reports:0.2.0
          localResources:
            environment:
              config:
                REPORT_CONTAINER: reports
        - name: web
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.2.0
      volumes:
        - name: notes
          hostPath:
            # A path on the node, mounted into the host pod and allowed by
            # k8s/values.yaml (hostPaths.allowed).
            path: /workshop/notes
