# Step 4: give the agent a real job, triaging pull requests on GitHub.
#
# The same agent as step 3, with the real gh tool in its slot and one new
# entry under hostInterfaces. gh gets no allowedHosts, no volumes and no
# token. Its only way to GitHub is workshop:toolbox/github-api, served by the
# github-api plugin the platform installed on the default host group
# (k8s/values.yaml). The plugin sends only GET, only to api.github.com, only
# for the read paths gh needs, and refuses everything else. The harness
# imports github-auth from the same plugin for the chat page's "Sign in with
# GitHub": the plugin runs the sign-in and keeps the token in its own
# memory, for this workload only. Nothing in the workload ever holds it.
#
# Each tool reaches only what this manifest grants it:
#   curl    the hosts in its allowedHosts (api.demo-sites.svc), and the
#           folder mounted at /data for -o
#   sqlite  the databases (talks, rooms) mounted read only at /data
#   gh      the github-api capability only
# The harness gets github-auth; the model gets nothing.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the demo websites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        # GitHub, as two capabilities the host links to the github-api plugin
        # the platform installed on the default host group (k8s/values.yaml):
        # github-api, which the gh tool imports, and github-auth (sign-in),
        # which the agent harness imports. Nothing else here imports either.
        - namespace: workshop
          package: toolbox
          interfaces: [github-api, github-auth]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.demo-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.demo-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the databases in /data (talks, rooms), mounted read only.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # gh: no grants of its own. It reaches GitHub only through the
        # github-api capability above.
        - name: gh
          image: workshop-toolbox-registry:5000/workshop/tool-gh:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
