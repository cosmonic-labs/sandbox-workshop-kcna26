# Step 4: give the agent a real job, triaging pull requests on GitHub.
#
# The same agent as step 3, with the real gh tool, and gh and the github-api
# capability added under hostInterfaces. gh gets no allowedHosts, no volumes
# and no token. Its only way to GitHub is workshop:toolbox/github-api,
# served by the github-api plugin the platform installed on the default host
# group (k8s/values.yaml). The plugin sends only GET, only to api.github.com, only
# for the read paths gh needs, and refuses everything else. The harness
# imports github-auth from the same plugin for the chat page's "Sign in with
# GitHub": the plugin runs the sign-in and keeps the token in its own
# memory, for this workload only. Nothing in the workload ever holds it.
#
# Each tool reaches only what this manifest grants it:
#   curl    the hosts in its allowedHosts (api.mock-sites.svc), and the
#           folder mounted at /data for -o
#   sqlite  the databases (talks, rooms) mounted read only at /data
#   gh      the github-api capability only
#   mcp     the talks MCP server (mcp.mock-sites.svc), and nothing else
# The harness gets github-auth; the model gets nothing.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the mock sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        # The agent's toolbox, served by the toolbox plugin.
        - namespace: cosmonic
          package: agent
          interfaces: [tools]
        # The tools in it. Each component below that exports one of these
        # offers it to the toolbox plugin. Named, because GitHub below is the
        # same package served by another plugin: the unnamed entry is the
        # default route for plain imports, and the tools aren't imported.
        - namespace: workshop
          package: toolbox
          name: tools
          interfaces: [curl, sqlite, gh, mcp]
        # GitHub, as two capabilities the host links to the github-api plugin:
        # github-api, which the gh tool imports, and github-auth (sign-in),
        # which the harness imports. Both plugins are installed on the default
        # host group (k8s/values.yaml).
        - namespace: workshop
          package: toolbox
          interfaces: [github-api, github-auth]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.mock-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.mock-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the databases in /data (talks, rooms), mounted read only.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # gh: no grants of its own. It reaches GitHub only through the
        # github-api capability above.
        - name: gh
          image: workshop-toolbox-registry:5000/workshop/tool-gh:0.4.0
        # mcp is an MCP client: it may reach only the talks MCP server, which
        # has its own grant (mock-sites/talks-mcp.yaml). No folders.
        - name: mcp
          image: workshop-toolbox-registry:5000/workshop/tool-mcp:0.4.0
          localResources:
            allowedHosts:
              - mcp.mock-sites.svc
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
