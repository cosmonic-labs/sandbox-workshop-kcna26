# The demo websites: an ordinary API page and a stand-in for an attacker's
# server, one component, inside the cluster.
#
# It runs in its own namespace on its own host group (hostSelector), never on
# the agent's host pod. The agent reaches it the ordinary way, by the
# Kubernetes Services in k8s/sites.yaml: api.demo-sites.svc and
# attacker.demo-sites.svc. The host routes a request by its Host header, so
# this workload serves those names (host and host-aliases). Upstream
# wasmCloud (v2.12.0) adds a Service's DNS names to a workload by itself only
# for wasi:http 0.2 handlers (wasmCloud#5582); this one is WASI 0.3, so the
# names are listed by hand.
#
# A caller still needs the name in its own allowedHosts: the host checks every
# outgoing request against that list before it leaves.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: demo-sites
  namespace: demo-sites
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: demo-sites
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: api.demo-sites.svc
            host-aliases: attacker.demo-sites.svc
      components:
        - name: demo-sites
          image: workshop-toolbox-registry:5000/workshop/demo-sites:0.4.0
