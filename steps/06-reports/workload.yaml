# Step 6: a reports tool writing through blobstore (wasmcloud:blobstore, WASI 0.3).
#
# reports is the only component that imports blobstore. The platform declares
# the backend (k8s/values.yaml) and creates the store (a NATS object store).
# There is no S3 backend in the stock host.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        - namespace: wasmcloud
          package: keyvalue
          version: 0.2.0
          interfaces: [store]
        - namespace: wasmcloud
          package: blobstore
          version: 0.1.0
          interfaces: [blobstore, container, types]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.2.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.2.0
        # memory is the only component that imports keyvalue. The platform
        # declares the backend (k8s/values.yaml) and creates the bucket.
        - name: memory
          image: workshop-toolbox-registry:5000/workshop/tool-memory:0.2.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: notes
          image: workshop-toolbox-registry:5000/workshop/tool-notes:0.2.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: reports
          image: workshop-toolbox-registry:5000/workshop/tool-reports:0.2.0
          localResources:
            environment:
              config:
                REPORT_CONTAINER: reports
        - name: web
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.2.0
      volumes:
        - name: notes
          hostPath:
            # A path on the node, mounted into the host pod and allowed by
            # k8s/values.yaml (hostPaths.allowed).
            path: /workshop/notes
