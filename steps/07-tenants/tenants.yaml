# Step 7: two tenants on one host.
#
# Two copies of the step 6 workload, one per tenant, each with its own
# ingress name, keyvalue bucket and blobstore container. Workloads do not
# share component instances, preopens or allowedHosts.
#
# Caveat (wash host v2.10.3): the NATS keyvalue plugin does NOT scope bucket
# names per workload. The bucket name is whatever the component opens, so
# tenant isolation for memory rests on each tenant's manifest naming a
# different bucket. See .run-free demo in steps/07-tenants/README.md.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-tenant-a
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: a.agent.localhost
        - namespace: wasi
          package: keyvalue
          version: 0.2.0-draft
          interfaces: [store]
        - namespace: wasi
          package: blobstore
          version: 0.2.0-draft
          interfaces: [blobstore]
          config:
            # The NATS blobstore refuses ("unauthorized") any container not
            # listed here. The list is per workload, not per component.
            buckets: tenant-a-reports
      components:
        - name: agent
          image: localhost:15051/workshop/agent:0.1.0
        - name: model
          image: localhost:15051/workshop/model-scripted:0.1.0
        # remember is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: remember
          image: localhost:15051/workshop/tool-remember:0.1.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: tenant-a-memory
        - name: read-notes
          image: localhost:15051/workshop/tool-read-notes:0.1.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: save-report
          image: localhost:15051/workshop/tool-save-report:0.1.0
          localResources:
            environment:
              config:
                REPORT_CONTAINER: tenant-a-reports
        - name: fetch
          image: localhost:15051/workshop/tool-fetch:0.1.0
          localResources:
            allowedHosts:
              - planted.example
      volumes:
        - name: notes
          hostPath:
            # Relative paths are a convenience of scripts/apply.py; on a
            # cluster this is an absolute path on the node.
            path: ../03-read-notes/notes
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
