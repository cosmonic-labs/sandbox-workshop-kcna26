# Step 2: give the agent curl, granted one host. The prebuilt curl: its reach
# is the allowedHosts line below. Built your own curl? Use workload-mine.yaml
# in this folder instead.
#
# The agent harness (the component that runs the loop: ask the model, call a
# tool, repeat) imports a model and five labelled tool slots: curl, sqlite,
# gh, git and kubectl. The host links each label to the workload component of
# the same name, so every slot must be filled. A slot with no real tool yet
# holds a placeholder (not-installed, or gh-not-installed for gh), which
# answers that the tool isn't installed.
#
# Each tool reaches only what this manifest grants it:
#   curl    the hosts in its allowedHosts (api.workshop-sites.svc), and the
#           folder mounted at /data for -o
#   sqlite, gh, git, kubectl   placeholders, no grants
# The harness and the model get nothing: no allowedHosts, no volumes.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the toy sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.workshop-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.workshop-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite arrives in step 3.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        # gh arrives in step 4. Its placeholder also answers GitHub sign-in,
        # which the harness imports, until step 4 declares the plugin.
        - name: gh
          image: workshop-toolbox-registry:5000/workshop/gh-not-installed:0.4.0
        # git is the extra in extras/git.
        - name: git
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        # kubectl is the extra in extras/kubectl.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
