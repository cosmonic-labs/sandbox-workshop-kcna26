# Step 6 control case: the same workload with web's allowedHosts widened
# to "*". Nothing else changes: same agent, same gullible model, same planted
# page. This time the leak reaches the collector, which shows the boundary
# (allowedHosts on the one component with network) is what stopped it.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: agent.localhost
        - namespace: wasi
          package: keyvalue
          version: 0.2.0-draft
          interfaces: [store]
        - namespace: wasi
          package: blobstore
          version: 0.2.0-draft
          interfaces: [blobstore]
          config:
            # The NATS blobstore refuses ("unauthorized") any container not
            # listed here. The list is per workload, not per component.
            buckets: reports
      components:
        - name: agent
          image: localhost:15051/workshop/agent:0.1.0
        - name: model
          image: localhost:15051/workshop/model-scripted:0.1.0
        # memory is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: memory
          image: localhost:15051/workshop/tool-memory:0.1.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: notes
          image: localhost:15051/workshop/tool-notes:0.1.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: reports
          image: localhost:15051/workshop/tool-reports:0.1.0
          localResources:
            environment:
              config:
                REPORT_CONTAINER: reports
        - name: web
          image: localhost:15051/workshop/tool-web:0.1.0
          localResources:
            allowedHosts:
              - "*"
      volumes:
        - name: notes
          hostPath:
            # Relative paths are a convenience of scripts/apply.py; on a
            # cluster this is an absolute path on the node.
            path: ../03-notes/notes
