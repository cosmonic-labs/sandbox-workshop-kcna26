# Step 3: a notes tool over a read only folder, mounted for that tool alone.
#
# Planted attack 1: notes/todo.txt tells the agent to read ../../etc/passwd
# and /etc/passwd and to append to the note. The scripted model obeys. The
# notes code is naive on purpose (it joins any path onto /notes and tries
# writes); the boundary is the manifest: one host directory, mounted read
# only, for this one component.
#
# The agent harness (the component that runs the loop: ask the model, call a
# tool, repeat) imports a model and four labelled tool slots: memory, notes,
# reports and web. The host links each label to the component of the same
# name in this workload, so every slot must be filled. Until a step installs
# the real tool, a slot is filled by not-installed: one image under several
# names, whose every function answers "the <tool> tool isn't installed yet".
# The harness and the model get nothing else: no allowedHosts, no volumes, no
# environment.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: agent.localhost
        - namespace: wasi
          package: keyvalue
          version: 0.2.0-draft
          interfaces: [store]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.1.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.1.0
        # memory is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: memory
          image: workshop-toolbox-registry:5000/workshop/tool-memory:0.1.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: notes
          image: workshop-toolbox-registry:5000/workshop/tool-notes:0.1.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: reports
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.1.0
        - name: web
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.1.0
      volumes:
        - name: notes
          hostPath:
            # A path on the node, mounted into the host pod and allowed by
            # k8s/values.yaml (hostPaths.allowed).
            path: /workshop/notes
