# Step 4: a reports tool writing through wasi:blobstore.
#
# reports is the only component that imports wasi:blobstore. The stock
# `wash host` backs it with a NATS JetStream object store (one bucket per
# container). There is no S3 backend in the stock host.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: agent.localhost
        - namespace: wasi
          package: keyvalue
          version: 0.2.0-draft
          interfaces: [store]
        - namespace: wasi
          package: blobstore
          version: 0.2.0-draft
          interfaces: [blobstore]
          config:
            # The NATS blobstore refuses ("unauthorized") any container not
            # listed here. The list is per workload, not per component.
            buckets: reports
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.1.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.1.0
        # memory is the only component that imports wasi:keyvalue. Under
        # `wash host` the backend is NATS JetStream KV (--data-nats-url).
        - name: memory
          image: workshop-toolbox-registry:5000/workshop/tool-memory:0.1.0
          localResources:
            environment:
              config:
                MEMORY_BUCKET: agent-memory
        - name: notes
          image: workshop-toolbox-registry:5000/workshop/tool-notes:0.1.0
          localResources:
            volumeMounts:
              - name: notes
                mountPath: /notes
                readOnly: true
        - name: reports
          image: workshop-toolbox-registry:5000/workshop/tool-reports:0.1.0
          localResources:
            environment:
              config:
                REPORT_CONTAINER: reports
        - name: web
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.1.0
      volumes:
        - name: notes
          hostPath:
            # A path on the node, mounted into the host pod and allowed by
            # k8s/values.yaml (hostPaths.allowed).
            path: /workshop/notes
