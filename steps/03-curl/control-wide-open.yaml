# Control for step 3, run by make prove only: the same agent with curl's
# allowedHosts widened to "*", to show the grant is the only thing stopping it.
#
# The agent harness (the component that runs the loop: ask the model, call a
# tool, repeat) imports a model and four labelled tool slots: curl, sqlite,
# git and kubectl. The host links each label to the workload component of the
# same name, so every slot must be filled. Here curl, sqlite and git have
# their real tools and the scripted model, so the agent answers straight away;
# kubectl holds a placeholder until step 6.
#
# Each tool reaches only what this manifest grants it:
#   curl    the hosts in its allowedHosts (api.workshop-sites.svc), and the folder
#           mounted at /data for -o
#   sqlite  the database mounted read only at /data
#   git     the repository mounted read only at /repo
# The harness and the model get nothing: no allowedHosts, no volumes.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the toy sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.workshop-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:  # control: widened to everything
              - "*"
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the talks database, mounted read only at /data.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # git reads the repository, mounted read only at /repo.
        - name: git
          image: workshop-toolbox-registry:5000/workshop/tool-git:0.4.0
          localResources:
            volumeMounts:
              - name: repo
                mountPath: /repo
                readOnly: true
        # The kubectl slot waits for step 6: the placeholder answers that the
        # tool isn't installed yet.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
        - name: repo
          hostPath:
            path: /workshop/repo
