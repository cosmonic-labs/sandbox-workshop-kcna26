# wash dev variant of steps 1 to 6 (no NATS, no registry, no Docker).
# Run from this folder after building: cd steps/dev && ../../.tools/wash dev
# Paths are relative to this folder.
#
# Limits found on v2.10.3 (see README): dev.volumes mount into EVERY
# component, read write, so step 3's attack is NOT contained here (and the
# append lands in steps/03-notes/notes/todo.txt; git checkout it); there is
# no localRoute, so test sites must be real listeners (127.0.0.1:18090).
# Without allowedHosts a dev component may reach any host, so every entry
# below says allowedHosts explicitly.
dev:
  command: "true"
  component_path: ../../target/wasm32-wasip2/release/agent.wasm
  address: 127.0.0.1:18100
  wasi_keyvalue_path: ../../.run/dev-kv
  wasi_blobstore_path: ../../.run/dev-blob
  volumes:
    - host_path: ../03-notes/notes
      guest_path: /notes
  components:
    - name: model
      file: ../../target/wasm32-wasip2/release/model_scripted.wasm
      allowedHosts: []
    - name: memory
      file: ../../target/wasm32-wasip2/release/tool_memory.wasm
      allowedHosts: []
    - name: notes
      file: ../../target/wasm32-wasip2/release/tool_notes.wasm
      allowedHosts: []
    - name: reports
      file: ../../target/wasm32-wasip2/release/tool_reports.wasm
      allowedHosts: []
    - name: web
      file: ../../target/wasm32-wasip2/release/tool_web.wasm
      allowedHosts:
        - 127.0.0.1:18090
workload:
  allowedHosts: []
