# Step 1: the agent answers over HTTP.
#
# The agent imports a model and four labelled tool slots. Each label must be
# filled by a component of that name in this workload, so until a step
# installs a real tool, the slot is filled by tool-stub (the same image under
# four names). The agent and the model get nothing else: no allowedHosts, no
# volumes, no environment.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  template:
    spec:
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [incoming-handler]
          config:
            host: agent.localhost
      components:
        - name: agent
          image: localhost:15051/workshop/agent:0.1.0
        - name: model
          image: localhost:15051/workshop/model-scripted:0.1.0
        - name: remember
          image: localhost:15051/workshop/tool-stub:0.1.0
        - name: read-notes
          image: localhost:15051/workshop/tool-stub:0.1.0
        - name: save-report
          image: localhost:15051/workshop/tool-stub:0.1.0
        - name: fetch
          image: localhost:15051/workshop/tool-stub:0.1.0
