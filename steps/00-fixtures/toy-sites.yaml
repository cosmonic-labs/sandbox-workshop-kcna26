# Fixture workload: the ordinary API page and the exfiltration collector, one
# component, inside the cluster.
#
# It runs in its own namespace on its own host group (hostSelector), never on
# the agent's host pod. The agent reaches it the ordinary way, by the
# Kubernetes Services in k8s/sites.yaml: api.workshop-sites.svc and
# collector.workshop-sites.svc. The host routes a request by its Host header,
# so this workload serves those names (host-aliases) and sites.localhost, the
# name your laptop uses through the ingress. Upstream wasmCloud (v2.12.0) adds a Service's DNS names to a
# workload by itself only for wasi:http 0.2 handlers (wasmCloud#5582); this
# one is WASI 0.3, so the names are listed by hand.
#
# A caller still needs the name in its own allowedHosts: the host checks every
# outgoing request against that list before it leaves.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toy-sites
  namespace: workshop-sites
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: fixtures
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: sites.localhost
            host-aliases: api.workshop-sites.svc,collector.workshop-sites.svc
        - namespace: wasmcloud
          package: keyvalue
          version: 0.2.0
          interfaces: [store, atomics]
      components:
        - name: toy-sites
          image: workshop-toolbox-registry:5000/workshop/toy-sites:0.4.0
