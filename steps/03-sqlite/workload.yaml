# Step 3: give the agent sqlite. The same agent as step 2, with the real
# sqlite tool in its slot. The sqlite folder holds two databases, main.db
# (the talks) and rooms.db.
#
# The agent harness (the component that runs the loop: ask the model, call a
# tool, repeat) imports a model and four labelled tool slots: curl, sqlite,
# git and kubectl. The host links each label to the workload component of the
# same name, so every slot must be filled. A slot with no real tool yet holds
# the placeholder, not-installed, which answers that the tool isn't installed.
#
# Each tool reaches only what this manifest grants it:
#   curl    the hosts in its allowedHosts (api.workshop-sites.svc), and the
#           folder mounted at /data for -o
#   sqlite  the databases (talks, rooms) mounted read only at /data
#   git, kubectl   placeholders, no grants
# The harness and the model get nothing: no allowedHosts, no volumes.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the toy sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.workshop-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.workshop-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the databases in /data (talks, rooms), mounted read only.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # git is the extra in extras/git.
        - name: git
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        # kubectl is the extra in extras/kubectl.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
