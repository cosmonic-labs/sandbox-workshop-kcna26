# Step 3: give the agent sqlite. The same agent as step 2, with the real
# sqlite tool in its slot. The sqlite folder holds two databases, main.db
# (the talks) and rooms.db.
#
# The agent harness (the component that runs the loop: ask the model, call a
# tool, repeat) imports a model and the agent SDK's `tools` interface
# (cosmonic:agent). The toolbox plugin, which the platform installed on the
# default host group (k8s/values.yaml), serves `tools`: it lists the tool
# components in this workload and calls the one the model asks for. A tool
# is in the agent's toolbox when its interface is listed under
# hostInterfaces below and a component here exports it.
#
# Each tool reaches only what this manifest grants it:
#   curl    the hosts in its allowedHosts (api.mock-sites.svc), and the
#           folder mounted at /data for -o
#   sqlite  the databases (talks, rooms) mounted read only at /data
#   gh      not in this workload yet
# The harness and the model get nothing: no allowedHosts, no volumes.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the mock sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        # The agent's toolbox, served by the toolbox plugin.
        - namespace: cosmonic
          package: agent
          interfaces: [tools]
        # The tools in it. Each component below that exports one of these
        # offers it to the toolbox plugin.
        - namespace: workshop
          package: toolbox
          name: tools
          interfaces: [curl, sqlite]
        # GitHub sign-in, which the harness imports, linked to the github-api
        # plugin the platform installed (k8s/values.yaml). Step 4 adds
        # github-api itself, for the gh tool.
        - namespace: workshop
          package: toolbox
          interfaces: [github-auth]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-scripted:0.4.0
        # curl may reach only api.mock-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.mock-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the databases in /data (talks, rooms), mounted read only.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
