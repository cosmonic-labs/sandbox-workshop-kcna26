# Extra: swap in a real model.
#
# The model slot is a label like any tool slot, so swapping the model is a
# manifest change, from model-scripted to model-real. Nothing is rebuilt. The
# tools are unchanged.
#
# model-real speaks the OpenAI chat completions API. LLM_URL points at the fake
# endpoint in the toy sites, so this still runs offline. For a hosted model, or
# the workshop's shared endpoint, change LLM_URL and allowedHosts and pass
# LLM_API_KEY from a Secret (environment.secretFrom). Only model-real may reach
# the model's host; no tool gets that grant.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-real:0.4.0
          localResources:
            allowedHosts:
              - llm.workshop-sites.svc
            environment:
              config:
                LLM_URL: http://llm.workshop-sites.svc/v1/chat/completions
                LLM_MODEL: fake-model
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.workshop-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        - name: git
          image: workshop-toolbox-registry:5000/workshop/tool-git:0.4.0
          localResources:
            volumeMounts:
              - name: repo
                mountPath: /repo
                readOnly: true
        # The kubectl slot: step 6 installs the real tool.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
        - name: repo
          hostPath:
            path: /workshop/repo
