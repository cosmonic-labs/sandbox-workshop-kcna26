# Extra: a real model, hosted. steps/04-kubectl/workload.yaml with one
# change: the model slot holds model-real instead of the scripted model.
# Nothing is rebuilt, and every tool keeps exactly the grant it had in step 4.
#
# model-real speaks the OpenAI chat completions API. As written it calls
# OpenAI; any OpenAI compatible service works if you change LLM_URL,
# LLM_MODEL and allowedHosts together. It reads LLM_API_KEY from the Secret
# llm-api-key (environment.secretFrom), which you create first:
#
#   kubectl create secret generic llm-api-key --from-literal=LLM_API_KEY=<your key>
#
# Only model-real may reach the model's host; no tool gets that grant, and
# no tool sees the key.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the toy sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        # The Kubernetes API, as a capability: the host links it to the
        # kube-api plugin. kubectl imports it; nothing else here does.
        - namespace: workshop
          package: toolbox
          interfaces: [kube-api]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        # The model slot holds model-real. It alone may reach the model's
        # host, and it reads LLM_API_KEY from the Secret llm-api-key.
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-real:0.4.0
          localResources:
            allowedHosts:
              - api.openai.com
            environment:
              config:
                LLM_URL: https://api.openai.com/v1/chat/completions
                LLM_MODEL: gpt-4o-mini
              secretFrom:
                - name: llm-api-key
        # curl may reach only api.workshop-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.workshop-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the databases in /data (talks, rooms), mounted read only.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # git is the extra in extras/git: the placeholder, no grants.
        - name: git
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        # kubectl: no grants of its own. It reaches the cluster only through
        # the kube-api capability above.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/tool-kubectl:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
