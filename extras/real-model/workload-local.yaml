# Extra: a real model on your own machine. steps/04-github/workload.yaml
# with one change: the model slot holds model-real instead of the scripted
# model. Nothing is rebuilt, and every tool keeps exactly the grant it had in
# step 4.
#
# model-real speaks the OpenAI chat completions API, which Ollama, llama.cpp's
# llama-server, LM Studio and vLLM all serve. As written it calls Ollama on
# the machine running kind (port 11434) with qwen3:4b, a small model that can
# call tools. host.docker.internal is that machine's name inside Docker
# Desktop and OrbStack containers. Change LLM_URL, LLM_MODEL and allowedHosts
# together for another server or model. No key is needed.
#
# Only model-real may reach the model's host; no tool gets that grant.

apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: toolbox-agent
spec:
  replicas: 1
  # The way in: the Service named toolbox-agent, which the platform created
  # with no selector (k8s/agent-service.yaml). The operator keeps it pointed
  # at the host pods that run this workload.
  kubernetes:
    service:
      name: toolbox-agent
  template:
    spec:
      # The default host group; the toy sites have one of their own.
      hostSelector:
        hostgroup: default
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces: [handler]
          config:
            host: agent.localhost
        # GitHub, as two capabilities the host links to the github-api plugin
        # the platform installed on the default host group (k8s/values.yaml):
        # github-api, which the gh tool imports, and github-auth (sign-in),
        # which the agent harness imports. Nothing else here imports either.
        - namespace: workshop
          package: toolbox
          interfaces: [github-api, github-auth]
      components:
        - name: agent
          image: workshop-toolbox-registry:5000/workshop/agent:0.4.0
        # The model slot holds model-real. It alone may reach the model's
        # host: the machine running kind, as Docker names it.
        - name: model
          image: workshop-toolbox-registry:5000/workshop/model-real:0.4.0
          localResources:
            allowedHosts:
              - host.docker.internal:11434
            environment:
              config:
                LLM_URL: http://host.docker.internal:11434/v1/chat/completions
                LLM_MODEL: qwen3:4b
        # curl may reach only api.workshop-sites.svc, and writes with -o only into /data.
        - name: curl
          image: workshop-toolbox-registry:5000/workshop/tool-curl:0.4.0
          localResources:
            allowedHosts:
              - api.workshop-sites.svc
            volumeMounts:
              - name: curl-data
                mountPath: /data
        # sqlite reads the databases in /data (talks, rooms), mounted read only.
        - name: sqlite
          image: workshop-toolbox-registry:5000/workshop/tool-sqlite:0.4.0
          localResources:
            volumeMounts:
              - name: sqlite-data
                mountPath: /data
                readOnly: true
        # gh: no grants of its own. It reaches GitHub only through the
        # github-api capability above.
        - name: gh
          image: workshop-toolbox-registry:5000/workshop/tool-gh:0.4.0
        # git is the extra in extras/git: the placeholder, no grants.
        - name: git
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
        # kubectl is the extra in extras/kubectl: the placeholder, no grants.
        - name: kubectl
          image: workshop-toolbox-registry:5000/workshop/not-installed:0.4.0
      volumes:
        - name: curl-data
          hostPath:
            path: /workshop/curl-data
        - name: sqlite-data
          hostPath:
            path: /workshop/sqlite-data
