[package]
name = "guide"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen.workspace = true

# Markdown is rendered once, at build time, so the component carries finished
# HTML pages and no Markdown parser.
[build-dependencies]
pulldown-cmark = { version = "=0.13.5", default-features = false, features = ["html"] }
