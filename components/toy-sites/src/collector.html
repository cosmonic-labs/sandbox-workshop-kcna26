<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>The attacker's loot</title>
<style>
  /* wasmCloud palette (brand/wasmcloud_visual-guidelines-1.0.pdf): Green Aqua
     #00c389, Light Gray #768692, Space Blue #002e5d, Gunmetal #253746,
     Gainsboro #d9e1e2. The alarm red is not a brand color: it is the state. */
  :root {
    --bg: #ffffff; --surface: #ffffff; --sunken: #eef3f4; --hover: #e3eaeb;
    --ink: #253746; --strong: #002e5d; --muted: #4c5e6c; --line: #c9d4d6; --line-soft: #d9e1e2;
    --brand: #00c389; --brand-ink: #007a55;
    --alarm: #b42318; --on-alarm: #ffffff; --alarm-tint: #fdeceb; --alarm-ink: #a11f15;
    --focus: #007a55; --logo-word: #788591;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #081317; --surface: #0e1d23; --sunken: #13272f; --hover: #1a333d;
      --ink: #e2eaec; --strong: #ffffff; --muted: #a3b4bd; --line: #2b4651; --line-soft: #1e3640;
      --brand: #00c389; --brand-ink: #3ddcaa;
      --alarm: #b42318; --on-alarm: #ffffff; --alarm-tint: #3b1714; --alarm-ink: #ff8a7e;
      --focus: #3ddcaa; --logo-word: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .display { font-family: "Lexend", "Futura", "Avenir Next", "Century Gothic", system-ui, sans-serif; }

  /* Header: the wasmCloud mark, the page, the event. */
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.7rem 1.25rem; border-bottom: 1px solid var(--line-soft);
  }
  .brand { display: flex; align-items: center; gap: 0.8rem; min-width: 0; flex-wrap: wrap; }
  .logo { height: 1.5rem; width: auto; display: block; flex: none; }
  .logo .m { fill: #00bc8e; }
  .logo .w { fill: var(--logo-word); }
  .brand .rule { width: 1px; align-self: stretch; background: var(--line); }
  h1 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--strong); letter-spacing: -0.01em; }
  .event { color: var(--muted); font-size: 0.85rem; }
  button {
    font: inherit; font-size: 0.85rem; font-weight: 600; padding: 0.35rem 0.9rem; border-radius: 0.5rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  button:hover { background: var(--hover); }

  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  .sub { margin: 0 0 1rem; color: var(--muted); }
  .sub code { color: var(--ink); }

  /* The counter: quiet while nothing has arrived, an alarm once anything has. */
  .counter {
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 0.25rem 1.75rem;
    padding: 1.25rem 1.75rem; border-radius: 1rem; background: var(--sunken); border: 1px solid var(--line-soft);
  }
  .num {
    font-size: 7.5rem; font-weight: 700; line-height: 0.95; letter-spacing: -0.04em; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .label { font-size: 1.6rem; font-weight: 600; color: var(--strong); line-height: 1.2; }
  .status { margin: 0.35rem 0 0; color: var(--muted); }
  .counter.hot { background: var(--alarm); border-color: var(--alarm); }
  .hot .num, .hot .label, .hot .status { color: var(--on-alarm); }

  .empty {
    margin: 1.25rem 0 0; padding: 1.25rem 1.5rem; border-radius: 0.75rem;
    border: 1px solid var(--line-soft); box-shadow: inset 0.3rem 0 0 var(--brand);
    font-size: 1.4rem; font-weight: 600; color: var(--strong);
  }

  /* Each leak, newest first. */
  #list { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 1rem; }
  #list > li {
    border: 1px solid var(--line); border-radius: 0.75rem; background: var(--surface);
    box-shadow: inset 0.35rem 0 0 var(--alarm); padding: 0.9rem 1.25rem 1rem 1.6rem;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 0.25rem 1.1rem; align-items: baseline; }
  .meta strong { font-size: 1.3rem; color: var(--strong); }
  .source { font-weight: 600; }
  .meta > span:not(.source):not(.badge) { color: var(--muted); }
  .badge {
    align-self: center; font-size: 0.75rem; font-weight: 700; line-height: 1.6;
    color: var(--on-alarm); background: var(--alarm); border-radius: 999px; padding: 0 0.65rem;
  }
  .detail { color: var(--muted); font-size: 0.85rem; margin: 0.2rem 0 0.7rem; overflow-wrap: anywhere; }
  .payload { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.3rem; }
  .payload > li {
    padding: 0.35rem 0.7rem; border-radius: 0.35rem; background: var(--sunken);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9rem;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .payload > li.secret {
    background: var(--alarm-tint); color: var(--alarm-ink); font-weight: 700;
    box-shadow: inset 0.25rem 0 0 var(--alarm);
  }

  @media (max-width: 40rem) {
    .counter { grid-template-columns: 1fr; }
    .num { font-size: 5rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">

    <span class="rule" aria-hidden="true"></span>
    <h1 class="display">The attacker's loot</h1>
    <span class="event">KubeCon workshop</span>
  </div>
  <button id="reset" type="button">Reset</button>
</header>
<main>
  <p class="sub">Everything that reaches <code>collector.example/collect</code>, newest first.</p>

  <section class="counter" id="counter" aria-live="polite" aria-atomic="true">
    <span class="num display" id="num">0</span>
    <div>
      <div class="label" id="label">leaks received</div>
      <p class="status" id="status">Connecting...</p>
    </div>
  </section>

  <p class="empty" id="empty">No loot yet. Nothing has reached the attacker.</p>
  <ol id="list" aria-label="Leaks, newest first"></ol>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'collector-seen';
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { seen = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {} };
  let known = null;
  let first = true;

  const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  function source(leak) {
    const ua = leak.agent || '';
    if (leak.host === 'collector.example') {
      return ['A component on the wasmCloud host', 'reached collector.example through local routing'];
    }
    if (leak.host === 'planted.example') {
      return ['The web tool, through its one allowed host', 'reached planted.example, the host in its allowedHosts, through local routing'];
    }
    if (/wget|curl/i.test(ua)) {
      return ['A container in the cluster', 'came in through the cluster ingress as sites.localhost'];
    }
    return ['Unknown sender', 'came in as ' + (leak.host || 'no host')];
  }

  const SECRET = /(sk-[\w-]+|token|eyJ[\w-]+|api[ _]?key|password)/i;

  function payloadLines(body) {
    return body.split(/ \| |\n/).map((s) => s.trim()).filter(Boolean);
  }

  function render(data) {
    const n = data.count;
    $('num').textContent = n;
    $('label').textContent = n === 1 ? 'leak received' : 'leaks received';
    $('counter').classList.toggle('hot', n > 0);
    $('empty').hidden = n > 0;
    const list = $('list');
    list.textContent = '';
    for (const leak of data.leaks) {
      // Keyed by number and size, so a slot from before a reset in another tab is not reused.
      const id = leak.n + ':' + leak.bytes;
      if (!seen[id]) seen[id] = first ? -1 : Date.now();
      const t = seen[id];
      const li = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const num = document.createElement('strong');
      num.className = 'display';
      num.textContent = 'Leak #' + leak.n;
      const when = document.createElement('span');
      when.textContent = t > 0 ? 'seen at ' + fmtTime(t) : 'before this page opened';
      const [who, how] = source(leak);
      const src = document.createElement('span');
      src.className = 'source';
      src.textContent = who;
      meta.append(num, src, when);
      if (t > 0 && Date.now() - t < 10000) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.textContent = 'new';
        meta.append(b);
      }
      const detail = document.createElement('p');
      detail.className = 'detail';
      detail.textContent = how + '. Host: ' + (leak.host || 'none') + ', User-Agent: ' +
        (leak.agent || 'none') + ', ' + leak.bytes + ' bytes.';
      const payload = document.createElement('ul');
      payload.className = 'payload';
      payload.setAttribute('aria-label', 'What it sent');
      for (const line of payloadLines(leak.body || '')) {
        const p = document.createElement('li');
        p.textContent = line;
        if (SECRET.test(line)) p.className = 'secret';
        payload.append(p);
      }
      li.append(meta, detail, payload);
      list.append(li);
    }
    save();
  }

  async function poll() {
    try {
      const url = known === null ? '/leaks' : '/leaks?since=' + known;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      if (!data.unchanged) {
        if (known !== null && data.count < known) seen = {};
        render(data);
        known = data.count;
        first = false;
      } else {
        // Refresh the "new" badges without another request.
        if (document.querySelector('.badge')) { known = null; }
      }
      $('status').textContent = 'Live. Checks every second.';
    } catch (e) {
      $('status').textContent = 'Cannot reach the collector. Is the cluster up?';
    }
  }

  $('reset').addEventListener('click', async () => {
    try {
      await fetch('/reset', { method: 'POST' });
      seen = {};
      save();
      known = null;
      await poll();
      $('status').textContent = 'Reset. Live. Checks every second.';
    } catch (e) {
      $('status').textContent = 'Reset failed: cannot reach the collector.';
    }
  });

  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
