# Step 3's memory tool for team-a: tool-memory's own source, built with its
# store import labelled `team-a`. The platform binds that label to team-a's
# store (k8s/values.yaml); the image is tool-memory-team-a.
[package]
name = "tool-memory-team-a"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "../tool-memory/src/lib.rs"

[features]
default = ["team-a"]
team-a = []
team-b = []

[dependencies]
wit-bindgen.workspace = true
