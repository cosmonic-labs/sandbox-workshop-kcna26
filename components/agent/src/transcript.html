<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Agent chat</title>
<style>
  /* wasmCloud palette (brand/wasmcloud_visual-guidelines-1.0.pdf): Green Aqua
     #00c389, Light Gray #768692, Space Blue #002e5d, Gunmetal #253746,
     Gainsboro #d9e1e2, Yellow #ffb600. Text tones are darkened or lightened
     from these until they pass WCAG AA at projector sizes.
     Dark mode follows the workshop deck's title slide: slate #0f1d27, hairline
     #233b4d, body text #d8dee1, mint #9fddcb for secondary text, gray all-caps
     labels. Every text tone is checked for WCAG AA on the surface it sits on. */
  :root {
    --bg: #ffffff; --surface: #ffffff; --sunken: #eef3f4; --hover: #e3eaeb;
    --ink: #253746; --strong: #002e5d; --muted: #4c5e6c; --line: #c9d4d6; --line-soft: #d9e1e2;
    --brand: #00c389; --brand-ink: #007a55; --on-brand: #002e5d;
    --danger: #b42318; --danger-bg: #fdeceb; --warn: #ffb600; --warn-bg: #fff6dc;
    --focus: #007a55; --logo-word: #788591;
    --rule: #d9e1e2; --label: #5b6b79; --mint-ink: #0f6e5c;
    --pill-bg: #e6f7f1; --pill-line: #9fddcb; --pill-ink: #007a55;
    --shadow: 0 1px 2px rgba(37, 55, 70, .08), 0 8px 24px -14px rgba(37, 55, 70, .45);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1d27; --surface: #152836; --sunken: #12222e; --hover: #1b3243;
      --ink: #d8dee1; --strong: #ffffff; --muted: #9aa9b5; --line: #233b4d; --line-soft: #1c3141;
      --brand: #00c389; --brand-ink: #00c389; --on-brand: #002e5d;
      --danger: #ff8a7e; --danger-bg: #3a1a1d; --warn: #ffb600; --warn-bg: #33280a;
      --focus: #00c389; --logo-word: #ffffff;
      --rule: #233b4d; --label: #8fa0ad; --mint-ink: #9fddcb;
      --pill-bg: #0b1720; --pill-line: #233b4d; --pill-ink: #00c389;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font: 1rem/1.55 "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  code, pre, .mono { font-family: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header: the wasmCloud mark, the page, the event. */
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.7rem 1.25rem; border-bottom: 1px solid var(--rule);
  }
  .brand { display: flex; align-items: center; gap: 0.8rem; min-width: 0; flex-wrap: wrap; }
  .logo { height: 1.5rem; width: auto; display: block; flex: none; }
  .logo .m { fill: #00bc8e; }
  .logo .w { fill: var(--logo-word); }
  .brand .rule { width: 1px; align-self: stretch; background: var(--line); }
  h1 {
    margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--strong); letter-spacing: -0.01em;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The event, as the title slide's pill. */
  .event {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1;
    color: var(--pill-ink); background: var(--pill-bg); border: 1px solid var(--pill-line);
    border-radius: 999px; padding: 0.35rem 0.75rem;
  }
  /* Small labels, as "PRESENTERS" on the title slide. */
  .kicker {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--label);
  }
  .btn {
    font: inherit; font-size: 0.85rem; font-weight: 600; padding: 0.35rem 0.9rem; border-radius: 0.5rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .tools { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; justify-content: flex-end; }

  /* GitHub sign-in (step 4): a button, then the code to enter, then who. */
  .gh { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
  .gh a { color: var(--brand-ink); font-weight: 600; }
  .gh code {
    font-size: 0.9rem; font-weight: 700; color: var(--strong); background: var(--sunken);
    padding: 0.1rem 0.45rem; border-radius: 0.35rem; letter-spacing: 0.05em;
  }
  .gh strong { color: var(--strong); }
  .gh .why { max-width: 22rem; }

  /* One centred reading column, as in a chat session. */
  .col { width: 100%; max-width: 48rem; margin: 0 auto; padding: 0 1.25rem; }
  main { flex: 1; }
  .runs { display: flex; flex-direction: column; gap: 2.25rem; padding: 1.75rem 0 1.5rem; }
  .empty { padding: 3rem 0 1rem; max-width: 36rem; }
  .empty h2 {
    margin: 0 0 0.4rem; font-size: 1.5rem; font-weight: 700; color: var(--strong); letter-spacing: -0.01em;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .empty p { margin: 0; color: var(--muted); }

  .turn { display: flex; flex-direction: column; gap: 0.6rem; }
  .user {
    align-self: flex-end; max-width: 80%; margin-bottom: 0.4rem; padding: 0.55rem 0.95rem;
    background: var(--sunken); color: var(--strong); border-radius: 1rem 1rem 0.25rem 1rem;
    font-size: 1.15rem; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* A tool call and its result, folded into one row. */
  .tool { border: 1px solid var(--line); border-radius: 0.65rem; background: var(--surface); font-size: 0.85rem; min-width: 0; }
  .tool summary {
    list-style: none; cursor: pointer; display: grid; align-items: center; gap: 0.15rem 0.6rem;
    grid-template-columns: auto auto minmax(0, 1fr) auto auto; padding: 0.5rem 0.75rem; border-radius: 0.65rem;
  }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary:hover { background: var(--hover); }
  .tool[open] summary { border-radius: 0.65rem 0.65rem 0 0; }
  .ico { width: 1.05rem; height: 1.05rem; display: block; color: var(--muted); }
  .tname { font-weight: 700; color: var(--strong); font-size: 0.9rem; }
  .targs { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tstat { font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; gap: 0.3rem; }
  .ok .tstat { color: var(--brand-ink); }
  .chev { width: 0.9rem; height: 0.9rem; color: var(--muted); }
  .tool[open] .chev { transform: rotate(180deg); }
  .tprev {
    grid-column: 2 / -1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tool[open] .tprev { display: none; }
  .tbody { border-top: 1px solid var(--line-soft); padding: 0.5rem 0.75rem 0.7rem; display: grid; gap: 0.5rem; }
  .tlabel { display: block; color: var(--muted); font-size: 0.75rem; font-weight: 600; margin-bottom: 0.15rem; }
  .tbody pre {
    margin: 0; padding: 0.45rem 0.6rem; background: var(--sunken); border-radius: 0.35rem;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16rem; overflow-y: auto; font-size: 0.8rem;
  }

  /* Refused by the host: red, and the reason always in view. */
  .refused { border-color: var(--danger); box-shadow: inset 0.3rem 0 0 var(--danger); background: var(--danger-bg); }
  .refused summary:hover { background: transparent; }
  .refused .ico, .refused .tstat { color: var(--danger); }
  .refused .tprev, .missing .tprev { white-space: normal; overflow-wrap: anywhere; font-weight: 600; }
  .refused .tbody { border-top-color: var(--danger); }
  .refused .tbody pre { background: var(--surface); }
  /* A slot with nothing installed, or a network failure: not a refusal. */
  .missing { border-color: var(--warn); box-shadow: inset 0.3rem 0 0 var(--warn); background: var(--warn-bg); }
  .missing .ico { color: var(--ink); }
  .missing .tstat { color: var(--ink); }
  .missing .tbody pre { background: var(--surface); }

  .notice { display: flex; align-items: center; gap: 0.6rem; color: var(--muted); font-size: 0.85rem; }
  .notice::before, .notice::after { content: ""; flex: 1; min-width: 1.5rem; border-top: 1px solid var(--line-soft); }
  .notice > span { max-width: 36rem; text-align: center; overflow-wrap: anywhere; }

  .answer { font-size: 1.05rem; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool + .answer, .notice + .answer { border-top: 1px solid var(--line-soft); padding-top: 0.8rem; margin-top: 0.3rem; }
  .meta { margin: 0; color: var(--mint-ink); font-size: 0.75rem; }

  /* The message box stays docked at the bottom. */
  .dock { position: sticky; bottom: 0; background: var(--bg); padding: 0.5rem 0 1rem; }
  .dock::before {
    content: ""; position: absolute; left: 0; right: 0; top: -1.25rem; height: 1.25rem; pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--bg));
  }
  /* Example prompts: one row that scrolls sideways, faded at the edge while there is more. */
  .examples { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; min-width: 0; }
  .chips {
    display: flex; gap: 0.4rem; flex: 1; min-width: 0; overflow-x: auto; scroll-snap-type: x proximity;
    scroll-behavior: smooth; scrollbar-width: thin; padding: 3px 3px 5px;
  }
  .chips.more {
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 3rem), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 3rem), transparent);
  }
  .chip {
    font: inherit; font-size: 0.75rem; padding: 0.25rem 0.7rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    flex: none; white-space: nowrap; scroll-snap-align: start;
  }
  .chip:hover { background: var(--hover); border-color: var(--muted); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .box {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.4rem 0.4rem 1rem;
    border: 1px solid var(--line); border-radius: 1.1rem; background: var(--surface); box-shadow: var(--shadow);
  }
  .box:focus-within { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus), var(--shadow); }
  .box input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font: inherit; font-size: 1.1rem; padding: 0.4rem 0;
  }
  .box input:focus-visible { outline: none; }
  .box input::placeholder { color: var(--muted); }
  .send {
    font: inherit; font-weight: 700; font-size: 0.95rem; padding: 0.45rem 1.1rem; border-radius: 0.8rem; cursor: pointer;
    border: 0; background: var(--brand); color: var(--on-brand);
  }
  .send:hover { background: #00ad7a; }
  .send:disabled { opacity: 0.55; cursor: default; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1rem; margin-top: 0.45rem; font-size: 0.75rem; color: var(--muted); }
  .foot p { margin: 0; }
  .foot p:first-child { color: var(--mint-ink); }
  .status { min-height: 1.2em; font-weight: 600; color: var(--ink); }

  @media (max-width: 40rem) {
    .tool summary { grid-template-columns: auto auto minmax(0, 1fr) auto; }
    .tstat { grid-column: 2 / -1; grid-row: 2; }
    .chev { display: none; }
    .user { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<main>
  <div class="col">
    <section class="runs" id="runs" aria-live="polite" aria-label="Runs, oldest first">
      <div class="empty" id="empty">
        <h2>Send the agent a prompt</h2>
        <p>The agent runs its loop on the cluster and returns a transcript: every tool it asked for, what each tool returned, and what the host refused. Pick an example below or type your own.</p>
      </div>
    </section>
  </div>
</main>

<footer class="dock">
  <form class="col" id="form">
    <div class="examples" role="group" aria-label="Example prompts">
      <span class="kicker" aria-hidden="true">Try</span>
      <div class="chips" id="chips">
        <button class="chip" type="button" title="Step 1">fetch http://api.workshop-sites.svc/data</button>
        <button class="chip" type="button" title="Step 2">curl -s http://169.254.169.254/latest/meta-data/</button>
        <button class="chip" type="button" title="Step 3">sqlite .shell id</button>
        <button class="chip" type="button" title="Step 3">sqlite attach 'file:/workshop/private-data/payroll.db?immutable=1' as p; select name, salary from p.salaries</button>
        <button class="chip" type="button" title="Step 4">triage the open PRs in wasmCloud/wasmCloud</button>
        <button class="chip" type="button" title="Step 4">gh api -X POST /repos/wasmCloud/wasmCloud/issues/5885/comments</button>
        <button class="chip" type="button" title="Step 4">curl -s https://api.github.com/repos/wasmCloud/wasmCloud/pulls</button>
      </div>
    </div>
    <div class="box">
      <label class="sr-only" for="prompt">Prompt</label>
      <input type="text" id="prompt" autocomplete="off" placeholder="Message the agent" required>
      <button class="send" id="send" type="submit">Send</button>
    </div>
    <div class="foot">
      <p>Sends to <code id="host">this agent</code>, the same as <code>curl -d '...'</code></p>
      <p class="status" id="status" role="status"></p>
    </div>
  </form>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'agent-runs:' + location.host;
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let runs = [];
  try { runs = JSON.parse(sessionStorage.getItem(KEY) || '[]'); } catch (e) { runs = []; }
  const save = () => { try { sessionStorage.setItem(KEY, JSON.stringify(runs)); } catch (e) {} };
  $('host').textContent = location.hostname;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };

  const SVGNS = 'http://www.w3.org/2000/svg';
  const ICONS = {
    wrench: 'M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z',
    check: 'M4.5 12.5l4.5 4.5L19.5 6.5',
    cross: 'M6 6l12 12M18 6L6 18',
    alert: 'M12 4l9 16H3zM12 10v4M12 17v.5',
    chev: 'M6 9l6 6 6-6',
  };
  function icon(name, cls) {
    const s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', cls);
    s.setAttribute('aria-hidden', 'true');
    s.setAttribute('fill', 'none');
    s.setAttribute('stroke', 'currentColor');
    s.setAttribute('stroke-width', '2.2');
    s.setAttribute('stroke-linecap', 'round');
    s.setAttribute('stroke-linejoin', 'round');
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', ICONS[name]);
    s.append(p);
    return s;
  }

  const CASES = {
    'access-denied': 'Refused: access denied',
    'not-found': 'Refused: not found',
    'no-such-store': 'Refused: no such store',
    'invalid-argument': 'Refused: invalid argument',
    'network': 'Failed: network',
    'unavailable': 'Failed: unavailable',
  };

  // Returns [verdict, message, refused?]. Refusals come from the host's policy;
  // an empty slot or a network failure is shown as a warning instead.
  function errorVerdict(rest) {
    try {
      const v = JSON.parse(rest);
      if (v && typeof v === 'object') {
        const [k, payload] = Object.entries(v)[0] || [];
        const msg = typeof payload === 'string' ? payload : '';
        if (k === 'other' && /isn't installed/.test(msg)) return ['Not installed', msg, false];
        if (k === 'network' || k === 'unavailable') return [CASES[k], msg || k, false];
        return [CASES[k] || 'Error: ' + k, msg || k, true];
      }
    } catch (e) {}
    return ['Error', rest, true];
  }

  // Parse the harness's plain-text transcript, one "[who] ..." per line.
  function parse(text) {
    const steps = [];
    for (const line of text.split('\n')) {
      const m = line.match(/^\[(user|model|agent|tool ([^\]]+))\] ?(.*)$/);
      if (!m) {
        if (steps.length && line.trim()) steps[steps.length - 1].text += '\n' + line;
        else if (line.trim()) steps.push({ kind: 'note', text: line });
        continue;
      }
      const [, who, tool, rest] = m;
      if (who === 'user') steps.push({ kind: 'user', text: rest });
      else if (who === 'agent') steps.push({ kind: 'note', text: rest });
      else if (tool) {
        const r = rest.match(/^(ok|error): ?(.*)$/);
        steps.push({ kind: 'tool', tool, ok: r ? r[1] === 'ok' : true, text: r ? r[2] : rest });
      } else {
        const c = rest.match(/^call ([\w-]+)\((.*)\)$/);
        if (c) steps.push({ kind: 'call', tool: c[1], text: c[2] });
        else if (rest.startsWith('error: ')) steps.push({ kind: 'model-error', text: rest.slice(7) });
        else steps.push({ kind: 'answer', text: rest });
      }
    }
    return steps;
  }

  const section = (label, text) => {
    const d = el('div');
    d.append(el('span', 'tlabel', label), el('pre', '', text));
    return d;
  };

  // One row per tool call: the name, its arguments, and how it ended. The
  // result (or the refusal) shows under it; the row opens to show both in full.
  function toolRow(name, args, res) {
    const d = el('details', 'tool');
    const sum = el('summary');
    let verdict = 'Returned';
    let preview = res ? res.text : 'No result';
    let iconName = 'wrench';
    if (res && !res.ok) {
      const [v, msg, refused] = errorVerdict(res.text);
      verdict = v;
      preview = msg;
      d.classList.add(refused ? 'refused' : 'missing');
      iconName = refused ? 'cross' : 'alert';
    } else if (res) {
      d.classList.add('ok');
    }
    const stat = el('span', 'tstat');
    if (res && res.ok) stat.append(icon('check', 'ico'));
    stat.append(document.createTextNode(verdict));
    sum.append(icon(iconName, 'ico'), el('span', 'tname mono', name),
      el('span', 'targs mono', args === null ? '' : args), stat, icon('chev', 'chev'),
      el('span', 'tprev mono', preview));
    const body = el('div', 'tbody');
    if (args !== null) body.append(section('Arguments', args || '(none)'));
    if (res) body.append(section(res.ok ? 'Result' : 'Host said', res.text));
    d.append(sum, body);
    return d;
  }

  function renderRun(run, i) {
    const art = el('article', 'turn');
    art.setAttribute('aria-label', 'Run ' + (i + 1));
    const steps = parse(run.text);
    for (let k = 0; k < steps.length; k++) {
      const s = steps[k];
      switch (s.kind) {
        case 'user': {
          const u = el('div', 'user');
          u.append(el('span', 'sr-only', 'You: '), document.createTextNode(s.text));
          art.append(u);
          break;
        }
        case 'call': {
          const next = steps[k + 1];
          const res = next && next.kind === 'tool' && next.tool === s.tool ? next : null;
          if (res) k++;
          art.append(toolRow(s.tool, s.text, res));
          break;
        }
        case 'tool':
          art.append(toolRow(s.tool, null, s));
          break;
        case 'model-error': {
          const row = toolRow('model', null, { ok: false, text: s.text });
          row.querySelector('.tstat').lastChild.textContent = 'Model error';
          art.append(row);
          break;
        }
        case 'answer':
          art.append(el('div', 'answer', s.text));
          break;
        default: {
          const n = el('div', 'notice');
          n.append(el('span', '', s.text));
          art.append(n);
        }
      }
    }
    art.append(el('p', 'meta', 'Run ' + (i + 1) + ' at ' + run.time + ' on ' + run.host));
    return art;
  }

  function renderAll() {
    const box = $('runs');
    box.querySelectorAll('.turn').forEach((n) => n.remove());
    $('empty').hidden = runs.length > 0;
    runs.forEach((r, i) => box.append(renderRun(r, i)));
  }

  async function send(prompt) {
    prompt = prompt.trim();
    if (!prompt) return;
    $('send').disabled = true;
    $('status').textContent = 'Waiting for the agent...';
    try {
      const res = await fetch('/', { method: 'POST', body: prompt, cache: 'no-store' });
      const text = await res.text();
      runs.push({
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        host: location.hostname, text: res.ok ? text : '[agent] HTTP ' + res.status + ': ' + text,
      });
      save();
      renderAll();
      $('status').textContent = '';
      $('prompt').value = '';
      window.scrollTo({ top: document.body.scrollHeight, behavior: reduced ? 'auto' : 'smooth' });
    } catch (e) {
      $('status').textContent = 'Cannot reach the agent. Is the workload running?';
    } finally {
      $('send').disabled = false;
      $('prompt').focus();
    }
  }

  // GitHub sign-in. The harness passes each call to the github-api plugin,
  // which runs GitHub's device flow and keeps the token; this page only sees
  // the code to enter, where to enter it, and the login once signed in.
  let ghTimer = null;
  async function gh(path, method) {
    try {
      const res = await fetch(path, { method: method || 'GET', cache: 'no-store' });
      return await res.json();
    } catch (e) {
      return { state: 'error', error: 'cannot reach the agent' };
    }
  }
  function ghButton(label, onClick) {
    const b = el('button', 'btn', label);
    b.type = 'button';
    b.addEventListener('click', async () => { b.disabled = true; await onClick(); });
    return b;
  }
  function ghShow(s) {
    const box = $('gh');
    box.replaceChildren();
    clearTimeout(ghTimer);
    if (s.state === 'signed-in') {
      box.append(document.createTextNode('Signed in to GitHub as '), el('strong', '', s.login),
        ghButton('Sign out', async () => ghShow(await gh('/github/sign-out', 'POST'))));
    } else if (s.state === 'pending') {
      const a = el('a', '', s.verification_uri.replace(/^https:\/\//, ''));
      a.href = s.verification_uri;
      a.target = '_blank';
      a.rel = 'noopener';
      box.append(document.createTextNode('Enter '), el('code', '', s.user_code),
        document.createTextNode(' at '), a,
        ghButton('Cancel', async () => ghShow(await gh('/github/sign-out', 'POST'))));
      ghTimer = setTimeout(async () => ghShow(await gh('/github/status')), 5000);
    } else {
      if (s.state === 'error') box.append(el('span', 'why', s.error));
      box.append(ghButton('Sign in with GitHub', async () => ghShow(await gh('/github/sign-in', 'POST'))));
    }
  }
  gh('/github/status').then((s) => ghShow(s.state === 'error' ? { state: 'signed-out' } : s));

  $('form').addEventListener('submit', (e) => { e.preventDefault(); send($('prompt').value); });
  document.querySelectorAll('.examples button').forEach((b) =>
    b.addEventListener('click', () => { $('prompt').value = b.textContent; send(b.textContent); }));
  // The chip row: fade the right edge while more chips are out of view, and
  // bring a chip into view when the keyboard focuses it.
  const chips = $('chips');
  const fade = () => chips.classList.toggle('more',
    chips.scrollLeft + chips.clientWidth < chips.scrollWidth - 2);
  chips.addEventListener('scroll', fade, { passive: true });
  window.addEventListener('resize', fade);
  chips.addEventListener('focusin', (e) => e.target.scrollIntoView(
    { block: 'nearest', inline: 'nearest', behavior: reduced ? 'auto' : 'smooth' }));
  fade();
  $('clear').addEventListener('click', () => { runs = []; save(); renderAll(); $('prompt').focus(); });

  renderAll();
  window.scrollTo(0, document.body.scrollHeight);
  $('prompt').focus();
})();
</script>
</body>
</html>
