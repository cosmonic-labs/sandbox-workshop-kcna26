[package]
name = "tool-git"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen.workspace = true
# Read-only git in pure Rust. default-features off keeps out the parts that
# shell out or need a network; the two vendored crates below carry wasm fixes.
gix = { version = "0.90.0", default-features = false, features = ["sha1", "revision", "blob-diff", "blame", "index"] }
