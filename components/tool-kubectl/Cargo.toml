# Not a workspace member: tokio_unstable (.cargo/config.toml) must reach this
# crate alone, so it builds from its own directory (`make kubectl`).
[package]
name = "tool-kubectl"
edition = "2024"
version = "0.1.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same version and features as the workshop's other WASI 0.3 components.
wit-bindgen = { version = "0.62.0", features = ["async-spawn", "inter-task-wakeup"] }
# The real kube-rs client, without TLS or kubeconfig loading: requests go
# through the kube-api capability, never a socket.
kube = { version = "5.0.0", default-features = false, features = ["client"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = "1"
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
