[workspace]
resolver = "2"
members = [
  "components/agent",
  "components/model-scripted",
  "components/model-real",
  "components/not-installed",
  "components/tool-curl",
  "components/tool-git",
  "components/tool-sqlite",
  "components/toy-sites",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# WASI 0.3: async exports and imports, and tasks spawned to write streams.
# Same version and features as Desktop's p3 templates (wasip3 0.9.0 pins it).
wit-bindgen = { version = "0.62.0", features = ["async-spawn", "inter-task-wakeup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The git tool's gitoxide needs two crates that don't build for
# wasm32-wasip2 as published: memmap2's stub mmap, and filetime. These vendored
# copies carry the fixes. Nothing else in the workspace uses them.
[patch.crates-io]
memmap2 = { path = "components/tool-git/vendor/memmap2" }
filetime = { path = "components/tool-git/vendor/filetime" }

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
