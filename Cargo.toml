[workspace]
resolver = "2"
members = [
  "components/agent",
  "components/model-scripted",
  "components/model-real",
  "components/not-installed",
  "components/tool-memory",
  "components/tool-memory-team-a",
  "components/tool-memory-team-b",
  "components/tool-notes",
  "components/tool-web",
  "components/toy-sites",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
# WASI 0.3: async exports and imports, and tasks spawned to write streams.
# Same version and features as Desktop's p3 templates (wasip3 0.9.0 pins it).
wit-bindgen = { version = "0.62.0", features = ["async-spawn", "inter-task-wakeup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
