[workspace]
resolver = "2"
members = [
  "components/agent",
  "components/model-scripted",
  "components/model-real",
  "components/not-installed",
  "components/tool-memory",
  "components/tool-notes",
  "components/tool-reports",
  "components/tool-web",
  "components/toy-sites",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
wit-bindgen = "0.62.0"
wstd = "0.6.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
