# Rebuilds every component from source in the pinned build image and fails
# when artifacts/ or a plugin digest in k8s/values.yaml differs from that
# build (scripts/artifacts.sh check). On main, the build is then published to
# this repo's packages, ghcr.io/<owner>/<repo>/<name>, with the same digests
# k8s/values.yaml pins.
#
# The runner is linux/arm64 because the build image is: a component's bytes
# depend on the build machine's host triple (build.Dockerfile).
name: artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Tools
        run: make tools

      - name: Build and compare with artifacts/
        run: make check-artifacts

      - name: Publish to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io
          REGISTRY_REPO_PREFIX: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/push.sh target/linux-arm64/wasm32-wasip2/release
          TAG="sha-${GITHUB_SHA::12}" scripts/push.sh target/linux-arm64/wasm32-wasip2/release
