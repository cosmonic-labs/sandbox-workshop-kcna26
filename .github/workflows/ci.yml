# The checks a participant's run depends on, on every push and pull request:
#
#   test      the components' unit tests, and clippy with warnings as errors
#   workshop  the workshop itself: make up on a fresh kind cluster, then
#             make verify, which replays steps 1 to 4 and checks every
#             answer and refusal. artifacts.yml proves artifacts/ is this
#             source; this proves it behaves.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup component add clippy

      - name: Unit tests
        run: cargo test --locked --workspace

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  workshop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Tools
        run: make tools

      - name: Cluster
        run: make up

      - name: Steps 1 to 4
        run: make verify

      - name: Host logs
        if: failure()
        run: |
          .tools/kubectl --context kind-workshop-toolbox -n wasmcloud logs deploy/hostgroup-default --tail 200 || true
          .tools/kubectl --context kind-workshop-toolbox get pods -A || true
