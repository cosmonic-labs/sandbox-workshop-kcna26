# The workshop's host image: wash v2.12.0 with the toolbox host plugin
# compiled in (host/README.md). CI builds and publishes it, like the
# components in artifacts/, to this repo's packages:
# ghcr.io/<owner>/<repo>/workshop-host.
#
#   pull_request    when the host's source changes, builds it for
#                   linux/amd64, to show it still compiles
#   push of a tag   workshop-host-<tag>, such as workshop-host-2.12.0-toolbox.2:
#                   builds linux/amd64 and linux/arm64 on native runners from
#                   the tagged commit, publishes them as one multi-platform
#                   image, workshop-host:<tag>, and prints its digest to pin
#                   in scripts/env.sh and k8s/values.yaml
#
# A wash build takes about half an hour, so it runs only when asked. Unlike
# artifacts/, the image's bytes are not reproducible (the base images and
# packages it installs move), so CI can't check a pin against its own build:
# the digest CI publishes is pinned in a commit after it.
name: host

on:
  pull_request:
    paths:
      - host/**
      - scripts/build-host.sh
      - wit/deps/**
      - .github/workflows/host.yml
  push:
    tags:
      - workshop-host-*

permissions:
  contents: read

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build for linux/amd64
        env:
          PLATFORM: linux/amd64
          HOST_IMAGE: workshop-host:check
        run: scripts/build-host.sh

  build:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build and push linux/${{ matrix.arch }}
        env:
          PLATFORM: linux/${{ matrix.arch }}
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HOST_IMAGE="ghcr.io/$GITHUB_REPOSITORY/workshop-host:${REF#workshop-host-}-${{ matrix.arch }}"
          export HOST_IMAGE
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          scripts/build-host.sh
          docker push "$HOST_IMAGE"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join into one multi-platform image
        env:
          REF: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/$GITHUB_REPOSITORY/workshop-host"
          TAG="${REF#workshop-host-}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          {
            echo "Published \`$IMAGE:$TAG\`. Pin it in scripts/env.sh and k8s/values.yaml:"
            echo
            echo '```'
            echo "HOST_IMAGE=$IMAGE:$TAG"
            echo "HOST_IMAGE_DIGEST=$digest"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$TAG@$digest"
